name: dvd-bridge

services:
  dvd:
    image: ${IMAGE_NAME:-ghcr.io/yuliankanters2011-tech/dvd}:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: dvd-bridge
    restart: unless-stopped
    init: true
    # Needed to mount the disc. NOT privileged, no host network, no host root.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - "${DEVICE:-/dev/sr0}:/dev/sr0:r"
    environment:
      DEVICE: /dev/sr0
      SHARE_DIR: /srv/dvd
      STATE_DIR: /var/lib/dvd
      POLL_SECONDS: ${POLL_SECONDS:-5}
      WEB_PORT: 8080
      PUID: ${PUID:-1024}
      PGID: ${PGID:-100}
      COPY_FILES: ${COPY_FILES:-false}
      AUTO_EJECT: ${AUTO_EJECT:-false}
      ISO_MAX_MISSING_PERCENT: ${ISO_MAX_MISSING_PERCENT:-0.5}
      FILMS_DIR: /volume1/video/Films
      MUSIC_DIR: /volume1/video/Muziek
      CONVERT_THREADS: ${CONVERT_THREADS:-2}
      CONVERT_CRF: ${CONVERT_CRF:-20}
      CONVERT_PRESET: ${CONVERT_PRESET:-veryfast}
      CONVERT_AUDIO_BITRATE: ${CONVERT_AUDIO_BITRATE:-192}
      SLEEP_IDLE_SECONDS: ${SLEEP_IDLE_SECONDS:-600}
      DRIVE_SPEED: ${DRIVE_SPEED:-0}
    ports:
      # For local-network use only. Do not forward this port on your router.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    volumes:
      # prepare-host.sh makes this dedicated host directory shared.
      # Without shared propagation, DSM would keep seeing an empty folder.
      - type: bind
        source: ${SHARE_PATH:-/volume1/dvd}
        target: /srv/dvd
        bind:
          propagation: rshared
      - dvd-state:/var/lib/dvd
      # Jellyfin libraries. Ordinary file writes do not need mount propagation.
      - type: bind
        source: ${FILMS_PATH:-/volume1/video/Films}
        target: /volume1/video/Films
      - type: bind
        source: ${MUSIC_PATH:-/volume1/video/Muziek}
        target: /volume1/video/Muziek
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  dvd-state: