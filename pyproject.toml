[project]
name = "dvd-bridge"
version = "1.1.0"
description = "Docker bridge from a Synology USB CD/DVD drive to a shared NAS folder and Jellyfin MP4"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]