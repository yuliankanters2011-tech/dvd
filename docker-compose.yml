# Kant-en-klaar installatiebestand voor Synology Container Manager.
# Dit bestand bouwt niets lokaals; het downloadt een gepubliceerde image.
#
# Standaard: GitHub Container Registry.
# Voor Docker Hub: zet in .env of project-environment:
#   IMAGE_NAME=docker.io/<jouw-dockerhub-gebruikersnaam>/dvd-bridge
#   IMAGE_TAG=latest
#
# Let op: voer eerst scripts/prepare-host.sh op de NAS uit.
# Anders blijft de schijfmap leeg door ontbrekende mount-propagation.

name: dvd-bridge

services:
  dvd:
    image: ${IMAGE_NAME:-ghcr.io/yuliankanters2011-tech/dvd}:${IMAGE_TAG:-latest}
    container_name: dvd-bridge
    restart: unless-stopped
    init: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - "${DEVICE:-/dev/sr0}:/dev/sr0:r"
    environment:
      DEVICE: /dev/sr0
      SHARE_DIR: /srv/dvd
      STATE_DIR: /var/lib/dvd
      POLL_SECONDS: ${POLL_SECONDS:-5}
      WEB_PORT: 8080
      PUID: ${PUID:-1024}
      PGID: ${PGID:-100}
      COPY_FILES: ${COPY_FILES:-false}
      AUTO_EJECT: ${AUTO_EJECT:-false}
      ISO_MAX_MISSING_PERCENT: ${ISO_MAX_MISSING_PERCENT:-0.5}
      FILMS_DIR: /volume1/video/Films
      MUSIC_DIR: /volume1/video/Muziek
      CONVERT_THREADS: ${CONVERT_THREADS:-2}
      CONVERT_CRF: ${CONVERT_CRF:-20}
      CONVERT_PRESET: ${CONVERT_PRESET:-veryfast}
      CONVERT_AUDIO_BITRATE: ${CONVERT_AUDIO_BITRATE:-192}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${SHARE_PATH:-/volume1/dvd}
        target: /srv/dvd
        bind:
          propagation: rshared
      - dvd-state:/var/lib/dvd
      - type: bind
        source: ${FILMS_PATH:-/volume1/video/Films}
        target: /volume1/video/Films
      - type: bind
        source: ${MUSIC_PATH:-/volume1/video/Muziek}
        target: /volume1/video/Muziek
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  dvd-state: